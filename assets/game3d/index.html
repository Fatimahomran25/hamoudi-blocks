<!--
  3D game world (Milestone 2) — loaded inside webview_flutter via
  loadFlutterAsset, with no internet connection needed (Three.js and the
  font are bundled locally under vendor/ and fonts/). Talks to Flutter over
  a JavaScript Channel named "GameChannel" (see game.js for the bridge
  message details, and lib/screens/game/game_screen.dart on the other end).
-->
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>بلوك حمودي</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <button id="exit-btn" aria-label="خروج">✖️</button>

    <div id="hearts-row" class="neo-chip"></div>

    <div id="progress-chip" class="neo-chip">
      <span id="progress-text">1 / 4</span> ⭐
    </div>

    <div id="target-card" class="neo-box" dir="rtl">
      <div id="target-symbol">؟</div>
      <div id="target-meta">
        <span id="target-word"></span>
        <span id="target-emoji"></span>
      </div>
    </div>

    <div id="speech-bubble" class="neo-box" dir="rtl"></div>

    <!--
      Small arrow icon for the direction hint — replaces the old big speech
      bubble, so it doesn't block the child's view during gameplay (explicit
      request). Audio still plays in full via Bridge.audio('hint_direction',
      ...), independently of this element.
    -->
    <div id="direction-arrow"></div>
  </div>

  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <button id="jump-btn" class="neo-round-btn" aria-label="قفز">⬆️</button>

  <!--
    Group switcher — a test tool only (?demo=1 mode without Flutter), so you
    can jump quickly between Arabic/English letters/numbers without having
    to finish every level of the current group first. The real buttons in
    the app live in MainMenuScreen and LanguageSelectScreen (Flutter), not
    here.
  -->
  <div id="demo-group-switcher" class="hidden"></div>

  <div id="loading-veil">
    <div class="loading-emoji">🧊</div>
  </div>

  <!--
    Level-end overlay — only shows up when the page is opened standalone in
    a regular browser (no GameChannel from Flutter), so the standalone
    browser test experience feels complete. Inside the real app, Flutter
    receives the result message and shows LevelResultScreen instead (see
    game.js: finishLevel()).
  -->
  <div id="demo-result-veil" class="hidden">
    <div class="neo-box demo-result-card" dir="rtl">
      <div id="demo-result-emoji">🎉</div>
      <div id="demo-result-title"></div>
      <div id="demo-result-subtitle"></div>
      <button id="demo-result-btn" class="neo-button">حاول مرة ثانية 🔁</button>
    </div>
  </div>

  <!--
    Standalone browser test mode intro (?demo=1): child name + avatar pick,
    so the "login to game world" experience is available without needing to
    run the full Flutter app. This is a test tool only — the real screens
    (account, profile) live in the app itself (lib/screens/onboarding/).
  -->
  <div id="demo-prologue" class="hidden">
    <div class="neo-box demo-prologue-card" dir="rtl">
      <div id="prologue-step-name">
        <div class="prologue-emoji">👋</div>
        <div class="prologue-title">شو اسم بطلنا؟</div>
        <input id="prologue-name-input" class="prologue-input" placeholder="مثلاً: حمودي" />
        <button id="prologue-name-btn" class="neo-button">التالي ➡️</button>
      </div>
      <div id="prologue-step-avatar" class="hidden">
        <div class="prologue-title">اختر شخصيتك يا بطل</div>
        <div id="prologue-avatar-grid" class="prologue-avatar-grid-3d"></div>
        <button id="prologue-avatar-btn" class="neo-button">ابدأ اللعب 🎮</button>
      </div>
    </div>
  </div>

  <!--
    Plain scripts (not type="module") on purpose — see the comment at the
    top of game.js for why (iOS WKWebView compatibility). three.min.js
    defines THREE as a global variable that game.js uses right after it.
  -->
  <script src="./vendor/three.min.js"></script>
  <script src="./game.js" defer></script>
</body>
</html>
