# Builds an iOS version of "Hamoudi Blocks" on a free cloud Mac (a GitHub
# Actions macOS runner), with no need for a real Mac. The output is an
# unsigned IPA — installed on Hamoudi's iPhone later via the Sideloadly
# tool (on a Windows machine, with a free Apple ID) instead of Xcode
# directly.
#
# Run it: manually from the repo's Actions tab ("Run workflow" button), or
# automatically on any push to the main branch.
name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: "stable"

      - run: flutter pub get

      # --no-codesign: no Apple signing certificate is needed here — signing
      # happens later, locally, via Sideloadly at actual install time using
      # a free Apple ID.
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r hamoudi_blocks_unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: hamoudi-blocks-ipa
          path: hamoudi_blocks_unsigned.ipa
          retention-days: 14
