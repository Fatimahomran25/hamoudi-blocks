name: hamoudi_blocks
description: "بلوك حمودي - لعبة تعليمية للحروف والأرقام لعمر 4 سنوات."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

# ملاحظة (راجعي NEXT_STEPS.md بجذر المشروع لتفاصيل كل مرحلة):
#   - Milestone 1 (هيكل التطبيق) و Milestone 2 (عالم اللعب 3D) و Milestone 3
#     (الصوت المسجّل) منتهيات.
#   - Milestone 4 (الباك اند): firebase_core, firebase_auth, cloud_firestore, firebase_messaging.
dependencies:
  flutter:
    sdk: flutter

  # ترجمة الويدجت الأساسية (اتجاه RTL صحيح، نصوص الأزرار الجاهزة...) للعربي.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # خط عربي/إنجليزي دائري كرتوني (Baloo Bhaijaan 2) — يُحمَّل من Google Fonts.
  google_fonts: ^6.2.1

  # إدارة الحالة (بروفايلات الأطفال، الجلسة، التقدم).
  provider: ^6.1.2

  # تخزين محلي فوري (بدون إنترنت) لحساب الوالد وبروفايلات الأطفال والتقدم.
  # لاحقاً (Milestone 4) نزامنه مع Firestore فوق نفس الطبقة (ProfileService).
  shared_preferences: ^2.3.3

  # لتوليد معرّفات فريدة لبروفايلات الأطفال.
  uuid: ^4.5.1

  # يعرض عالم اللعب ثلاثي الأبعاد (Three.js محلي بـ assets/game3d/) داخل
  # WebView بدون إنترنت — التواصل مع Flutter عبر JavaScript Channel
  # (راجعي lib/screens/game/game_screen.dart).
  webview_flutter: ^4.14.1

  # تشغيل المقاطع الصوتية المسجّلة مسبقاً (Piper TTS محلي، صوت عربي طبيعي)
  # بـ assets/audio/ — راجعي lib/services/audio_service.dart.
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # الصوت المسجّل مسبقاً (Azure Neural TTS، صوت سعودي — راجعي
    # lib/services/audio_service.dart لتفاصيل التشغيل والتسمية):
    #   content/       — "يا بطل! قول: أ... أسد!" (74 ملف: ar_letter_0..27،
    #                    en_letter_0..25، ar_number_0..9، en_number_0..9؛
    #                    الترقيم يطابق ترتيب lib/data/content_repository.dart).
    #   content_found/ — تكرار الحرف 3 مرات عند النجاح ("لقينا حرف الألف!
    #                    الألف! الألف! الألف!") — نفس ترقيم content/.
    #   phrases/       — عبارات عامة (ترحيب، تشجيع، تلميح اتجاه، خطأ، فوز...).
    - assets/audio/content/
    - assets/audio/content_found/
    - assets/audio/phrases/
    - assets/images/

    # عالم اللعب ثلاثي الأبعاد (Milestone 2) — Three.js محلي بالكامل
    # (بدون إنترنت)، يُحمَّل عبر webview_flutter's loadFlutterAsset.
    # ملاحظة: تعريف الأصول بفلَتر ما يشمل المجلدات الفرعية تلقائياً،
    # فلازم كل مجلد فيه ملفات يُذكر لحاله (vendor/ للمكتبة، fonts/ للخط).
    - assets/game3d/
    - assets/game3d/vendor/
    - assets/game3d/fonts/
